<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <h1>Hotel Room Booking Form</h1>
    <form action="#" method="post"> 
        <label for="full name">Full Name:</label> 
        <input type="text" id="full name" name="Full name" placeholder="enter your full name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="ente your email" required><br><br>

        <label for="password">password</label>
        <input type="password" id="password" name="password"  placeholder="enter your password"required><br><br>

        <label for="gender">gender</label>
        <input type="radio" id="gender" name="gender" required>male
        <input type="radio" id="gender" name="gender"  required>female
        <input type="radio" id="gender" name="gender" required>other<br><br>

        <label for="course">course</label>
        <select id="course" name="couorse" required>
            <option value="">Select a course</option>
            <option value="single">b.tech</option>
            <option value="double">b.sc</option>
            <option value="suite">b.com</option>
        </select><br><br>

        <label>contact no.</label>
        <input type="tel" id="contact no." name="contact no." placeholder="enter your contact no." required><br><br>


        <label for="address">address</label>
        <textarea id="address" name="address" placeholder="enter your address" rows="4" cols="50"></textarea><br><br>

        <input type="submit" value="Submit">
  
    </form>
    
</body>
</html>
